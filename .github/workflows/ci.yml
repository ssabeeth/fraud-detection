name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: No competition rows in the repository
        run: git ls-files -z | xargs -0 uv run --no-sync python scripts/check_no_raw_data.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Cache the Delta Lake jars
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync pytest -m "not kafka" --cov=fraud --cov-report=term

  spark-jobs:
    # The lakehouse jobs end to end on the synthetic fixtures, as `make lakehouse` runs
    # them on the real data.
    runs-on: ubuntu-latest
    env:
      FRAUD_DATA_DIR: /tmp/fraud-data
      FRAUD_SPARK_DRIVER_MEMORY: 2g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync fraud bronze --raw-dir tests/fixtures --keep-source
      - run: uv run --no-sync fraud silver
      - run: uv run --no-sync fraud gold

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        run: docker compose config --quiet
