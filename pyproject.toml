[project]
name = "fraud"
version = "0.1.0"
description = "Real-time card fraud scoring with point-in-time features and a review policy chosen by expected money lost."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sabeeth" }]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2,<3",  # PySpark 4.2 does not yet support pandas 3
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Lakehouse jobs (bronze, silver, gold, features). Needs Java 17.
spark = [
    "delta-spark>=4.1",
    "pyspark>=4.0.1",
]
# Models, evaluation and experiment tracking.
ml = [
    "lightgbm>=4.5",
    "mlflow>=3.0",
    "scikit-learn>=1.5",
]
# Streaming: Kafka API client for Redpanda.
stream = [
    "confluent-kafka>=2.5",
]
# Scoring API.
serve = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "prometheus-client>=0.20",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]
# Drift and performance monitoring.
monitor = [
    "evidently>=0.7",
]
# Download from Kaggle (needs the owner's token in ~/.kaggle/kaggle.json).
kaggle = [
    "kaggle>=1.6",
]

[project.scripts]
fraud = "fraud.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.hatch.build.targets.wheel.force-include]
# The wheel runs on Databricks without the repository, so it carries the configs.
"configs" = "fraud/_configs"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD", "NPY"]
ignore = [
    "RUF001", # allow unicode (e.g. ×, −) in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: test starts a local Spark session (needs Java 17)",
    "kafka: test needs the Redpanda broker from docker-compose",
    "slow: test takes more than a few seconds",
]
