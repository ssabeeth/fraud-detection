[project]
name = "fraud"
version = "0.1.0"
description = "Real-time card fraud scoring with point-in-time features and a review policy chosen by expected money lost."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sabeeth" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
fraud = "fraud.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD", "NPY"]
ignore = [
    "RUF001", # allow unicode (e.g. ×, −) in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: test starts a local Spark session (needs Java 17)",
    "kafka: test needs the Redpanda broker from docker-compose",
    "slow: test takes more than a few seconds",
]
